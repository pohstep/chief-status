"$schema" = "./node_modules/wrangler/config-schema.json"
name = "chief-status"
main = "src/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = [ "nodejs_compat" ]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# The password bots send is NOT written here.
# Set it with: npx wrangler secret put STATUS_TOKEN
# READ_TOKEN is optional and is not required, so a deploy works without it.
# When that secret is set, GET /status and /status/live require Authorization: Bearer <token>.
# /status/live also accepts ?token=<token>. GET /status does not.
# Set it in the dashboard, or with: npx wrangler secret put READ_TOKEN
[secrets]
required = [ "STATUS_TOKEN" ]

# BOTS is an optional starter list and order. Leave it empty: a new feed has no rows
# until a bot posts. Optional link: Agent1|https://example.com/agent1 or BOT_URLS below.
# TZ is an IANA name used for the daily job log. STALE_MINUTES marks a long working row.
[vars]
BOTS = ""
BOT_URLS = ""
TZ = "UTC"
STALE_MINUTES = "60"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "StatusRoom"

# SQLite-backed Durable Objects are the free-plan kind. This tag runs on deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = [ "StatusRoom" ]
